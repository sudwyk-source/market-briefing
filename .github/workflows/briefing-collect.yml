name: briefing-collect

on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "20 12 * * *"
    - cron: "0 21 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "회차 (0530 / 22)"
        required: true
        default: "22"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install requests beautifulsoup4 lxml youtube-transcript-api

      - name: collect
        env:
          S: ${{ github.event.inputs.session || '22' }}
        run: |
          D=$(TZ=Asia/Seoul date +%Y%m%d)
          rm -rf bundles/images
          mkdir -p bundles/images
          echo "=== session=$S date=$D"
          python collect.py --session "$S" --out "bundles/${D}_${S}.md"
          echo "=== exit=$?"
          cp "bundles/${D}_${S}.md" bundles/latest.md
          ls -la bundles bundles/images

      - name: commit
        if: always()
        run: |
          git config user.name briefing-bot
          git config user.email briefing-bot@users.noreply.github.com
          git add -A bundles || true
          git diff --staged --quiet || git commit -m "collect"
          git push || true
